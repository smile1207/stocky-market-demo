<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>STOCKY 市場展示 Demo</title>
    <style>
      :root {
        color-scheme: light;
        --paper: #f7f3ea;
        --panel: #fffaf0;
        --line: #e3dac9;
        --ink: #172321;
        --muted: #52615e;
        --deep: #23302f;
        --mint: #1b5b55;
        --green: #116647;
        --red: #963f33;
        --gold: #9f6a1b;
        --amber: #f1c96b;
        --rose: #8a4a64;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          "Noto Sans TC", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          linear-gradient(135deg, rgba(27, 91, 85, 0.1), transparent 30%),
          linear-gradient(315deg, rgba(159, 106, 27, 0.12), transparent 34%),
          var(--paper);
        color: var(--ink);
      }

      button {
        border: 0;
        font: inherit;
        cursor: pointer;
      }

      .app {
        width: min(1120px, 100%);
        margin: 0 auto;
        padding: 24px;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 16px;
      }

      .kicker {
        color: var(--rose);
        font-size: 13px;
        font-weight: 800;
      }

      h1 {
        margin: 2px 0 0;
        font-size: clamp(30px, 5vw, 56px);
        line-height: 0.98;
        letter-spacing: 0;
      }

      .owner {
        margin: 8px 0 0;
        color: var(--muted);
        font-weight: 700;
      }

      .reset {
        width: 44px;
        height: 44px;
        border-radius: 8px;
        background: #e6dfd1;
        color: var(--deep);
        font-size: 20px;
      }

      .start-screen {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .start-panel {
        width: min(720px, 100%);
        padding: clamp(28px, 7vw, 64px);
        border: 1px solid var(--line);
        border-radius: 8px;
        background:
          linear-gradient(145deg, rgba(255, 250, 240, 0.95), rgba(247, 243, 234, 0.9)),
          var(--panel);
        box-shadow: 0 24px 70px rgba(23, 35, 33, 0.14);
      }

      .start-logo {
        color: var(--rose);
        font-size: 14px;
        font-weight: 900;
      }

      .start-title {
        margin: 8px 0 14px;
        font-size: clamp(44px, 12vw, 96px);
        line-height: 0.92;
        letter-spacing: 0;
      }

      .start-copy {
        max-width: 520px;
        margin: 0 0 28px;
        color: var(--muted);
        font-size: clamp(16px, 2.4vw, 20px);
        line-height: 1.65;
        font-weight: 750;
      }

      .start-button {
        min-height: 54px;
        padding: 0 28px;
        border-radius: 8px;
        background: var(--ink);
        color: white;
        font-weight: 950;
      }

      .start-button:hover,
      .start-button:focus-visible {
        background: var(--mint);
      }

      .app.is-hidden,
      .start-screen.is-hidden,
      .settlement-screen.is-hidden {
        display: none;
      }

      .settlement-screen {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .settlement-panel {
        width: min(760px, 100%);
        padding: clamp(28px, 7vw, 56px);
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        box-shadow: 0 24px 70px rgba(23, 35, 33, 0.14);
      }

      .settlement-title {
        margin: 6px 0 22px;
        font-size: clamp(34px, 8vw, 72px);
        line-height: 0.96;
      }

      .settlement-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
        margin-bottom: 24px;
      }

      .settlement-metric {
        min-height: 112px;
        padding: 16px;
        border-radius: 8px;
        color: white;
      }

      .settlement-metric:first-child {
        background: var(--mint);
      }

      .settlement-metric:last-child {
        background: var(--deep);
      }

      .settlement-metric span {
        display: block;
        color: rgba(255, 255, 255, 0.72);
        font-size: 13px;
        font-weight: 900;
      }

      .settlement-metric strong {
        display: block;
        margin-top: 8px;
        font-size: clamp(28px, 6vw, 48px);
        line-height: 1;
      }

      .settlement-copy {
        margin: 0 0 24px;
        color: var(--muted);
        line-height: 1.65;
        font-weight: 750;
      }

      .dashboard {
        display: grid;
        grid-template-columns: 1.04fr 0.96fr;
        gap: 16px;
        align-items: start;
      }

      .summary {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        margin-bottom: 10px;
      }

      .metric {
        border-radius: 8px;
        padding: 12px;
        color: white;
        min-height: 70px;
      }

      .metric:nth-child(1) {
        background: var(--deep);
      }

      .metric:nth-child(2) {
        background: var(--mint);
      }

      .metric:nth-child(3) {
        background: var(--gold);
      }

      .metric span {
        display: block;
        color: rgba(255, 255, 255, 0.72);
        font-size: 12px;
        font-weight: 800;
      }

      .metric strong {
        display: block;
        margin-top: 4px;
        font-size: 24px;
        line-height: 1;
      }

      .panel {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
      }

      .economy {
        padding: 14px;
        display: grid;
        gap: 12px;
        margin-bottom: 10px;
      }

      .gauge-line {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 6px;
        color: var(--muted);
        font-size: 13px;
        font-weight: 800;
      }

      .track {
        height: 8px;
        border-radius: 999px;
        overflow: hidden;
        background: #e6dfd1;
      }

      .fill {
        height: 100%;
        border-radius: 999px;
        background: var(--mint);
        transition: width 180ms ease;
      }

      .fill.danger {
        background: var(--red);
      }

      .actions {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 10px;
        margin-bottom: 8px;
      }

      .primary,
      .token {
        min-height: 46px;
        border-radius: 8px;
        font-weight: 900;
      }

      .primary {
        background: var(--ink);
        color: white;
      }

      .token {
        min-width: 132px;
        background: var(--amber);
        color: #5a3612;
      }

      .message {
        min-height: 34px;
        color: var(--muted);
        font-size: 14px;
        font-weight: 700;
      }

      .tabs {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 4px;
        padding: 4px;
        border-radius: 8px;
        background: #e6dfd1;
        margin-bottom: 12px;
      }

      .tab {
        min-height: 40px;
        border-radius: 6px;
        color: var(--muted);
        background: transparent;
        font-weight: 900;
      }

      .tab.active {
        background: var(--deep);
        color: white;
      }

      .section {
        display: none;
      }

      .section.active {
        display: block;
      }

      .rail {
        display: grid;
        grid-template-columns: repeat(5, minmax(112px, 1fr));
        gap: 8px;
        margin-bottom: 12px;
      }

      .stock-chip {
        min-height: 72px;
        padding: 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        text-align: left;
      }

      .stock-chip.active {
        background: var(--mint);
        border-color: var(--mint);
        color: white;
      }

      .code {
        display: block;
        color: var(--rose);
        font-size: 12px;
        font-weight: 900;
      }

      .stock-chip.active .code {
        color: white;
      }

      .stock-chip b {
        display: block;
        margin-top: 3px;
      }

      .stock-panel {
        padding: 16px;
      }

      .stock-head {
        display: flex;
        justify-content: space-between;
        gap: 12px;
      }

      h2 {
        margin: 0;
        font-size: 26px;
        line-height: 1.08;
      }

      .meta {
        margin-top: 4px;
        color: var(--muted);
        font-size: 13px;
        font-weight: 800;
      }

      .price-badge {
        align-self: start;
        padding: 7px 9px;
        border-radius: 8px;
        font-size: 13px;
        font-weight: 900;
        white-space: nowrap;
      }

      .up {
        background: #d8efe2;
        color: var(--green);
      }

      .down {
        background: #f0d8d3;
        color: var(--red);
      }

      .big-price {
        margin: 8px 0 2px;
        font-size: clamp(42px, 8vw, 72px);
        line-height: 1;
        font-weight: 950;
      }

      .desc {
        color: var(--muted);
        line-height: 1.65;
        font-weight: 650;
      }

      .depth {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
        margin-top: 16px;
      }

      .depth-item span {
        color: var(--muted);
        font-size: 12px;
        font-weight: 900;
      }

      .trade {
        margin-top: 12px;
        padding: 14px;
      }

      .section-title {
        margin: 0 0 10px;
        font-size: 18px;
        font-weight: 950;
      }

      .trade-row {
        display: grid;
        grid-template-columns: 1fr 88px 88px;
        align-items: center;
        gap: 8px;
        min-height: 52px;
        padding: 8px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: white;
      }

      .trade-row + .trade-row {
        margin-top: 8px;
      }

      .buy,
      .sell {
        height: 36px;
        border-radius: 8px;
        color: white;
        font-weight: 950;
      }

      .buy {
        background: var(--green);
      }

      .sell {
        background: var(--red);
      }

      .holding,
      .news-row {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        padding: 14px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
      }

      .holding + .holding,
      .news-row + .news-row {
        margin-top: 8px;
      }

      .holding small {
        display: block;
        margin-top: 4px;
        color: var(--muted);
        font-weight: 750;
      }

      .right {
        text-align: right;
        white-space: nowrap;
      }

      .empty {
        min-height: 160px;
        display: grid;
        place-items: center;
        color: #7b827e;
        font-weight: 900;
      }

      .foresight {
        padding: 14px;
        margin-bottom: 12px;
      }

      .foresight-card {
        padding: 12px;
        border-radius: 8px;
        background: #f7e6b5;
      }

      .foresight-card b {
        display: block;
        margin-bottom: 5px;
      }

      .foresight-card p {
        margin: 0;
        color: #5a3612;
        line-height: 1.55;
        font-weight: 700;
      }

      .news-row {
        justify-content: flex-start;
        line-height: 1.55;
        font-weight: 750;
      }

      .dot {
        width: 8px;
        height: 8px;
        flex: 0 0 auto;
        margin-top: 8px;
        border-radius: 50%;
        background: var(--rose);
      }

      @media (max-width: 860px) {
        .app {
          padding: 16px;
        }

        .dashboard {
          grid-template-columns: 1fr;
        }

        .rail {
          display: flex;
          overflow-x: auto;
          padding-bottom: 2px;
        }

        .stock-chip {
          flex: 0 0 116px;
        }

        .depth {
          grid-template-columns: repeat(2, 1fr);
        }
      }

      @media (max-width: 520px) {
        .start-screen {
          padding: 16px;
        }

        .start-panel {
          padding: 28px;
        }

        .start-button {
          width: 100%;
        }

        .settlement-screen {
          padding: 16px;
        }

        .settlement-panel {
          padding: 28px;
        }

        .settlement-grid {
          grid-template-columns: 1fr;
        }

        .summary {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }

        .metric {
          min-height: 62px;
          padding: 10px;
        }

        .metric strong {
          font-size: 18px;
        }

        .trade-row {
          grid-template-columns: 1fr 68px 68px;
        }

        .actions {
          grid-template-columns: 1fr;
        }

        .token {
          min-width: 0;
        }
      }
    </style>
  </head>
  <body>
    <section class="start-screen" id="startScreen">
      <div class="start-panel">
        <div class="start-logo">STOCKY MARKET DEMO</div>
        <h1 class="start-title">STOCKY</h1>
        <p class="start-copy">買賣股票、觀察市場消息，在價格波動中累積資產。</p>
        <button class="start-button" id="startGameBtn">開始遊戲</button>
      </div>
    </section>

    <main class="app is-hidden" id="gameApp">
      <header class="topbar">
        <div>
          <div class="kicker">STOCKY 市場 Demo</div>
          <h1>市場</h1>
          <p class="owner">單機市場、定價買賣、通膨穩定機制展示版</p>
        </div>
        <button class="reset" id="resetBtn" title="重置市場">↻</button>
      </header>

      <div class="dashboard">
        <section>
          <div class="summary">
            <div class="metric"><span>Day</span><strong id="dayText">1</strong></div>
            <div class="metric"><span>Cash</span><strong id="cashText">$0</strong></div>
            <div class="metric"><span>Equity</span><strong id="equityText">$0</strong></div>
          </div>

          <div class="panel economy">
            <div>
              <div class="gauge-line"><span>通膨</span><b id="inflationText">0%</b></div>
              <div class="track"><div class="fill" id="inflationFill"></div></div>
            </div>
            <div>
              <div class="gauge-line"><span>市場熱度</span><b id="heatText">0%</b></div>
              <div class="track"><div class="fill" id="heatFill"></div></div>
            </div>
            <div>
              <div class="gauge-line"><span>穩定基金</span><b id="fundText">$0</b></div>
              <div class="track"><div class="fill" id="fundFill"></div></div>
            </div>
          </div>

          <div class="actions">
            <button class="primary" id="nextDayBtn">下一日收盤</button>
            <button class="token" id="foresightBtn">代幣預知 0</button>
          </div>
          <div class="message" id="messageText"></div>
        </section>

        <section>
          <nav class="tabs" aria-label="Demo tabs">
            <button class="tab active" data-tab="market">市場</button>
            <button class="tab" data-tab="portfolio">資產</button>
            <button class="tab" data-tab="news">行情</button>
          </nav>

          <div class="section active" id="marketSection">
            <div class="rail" id="stockRail"></div>
            <div class="panel stock-panel">
              <div class="stock-head">
                <div>
                  <h2 id="stockName"></h2>
                  <div class="meta" id="stockMeta"></div>
                </div>
                <div class="price-badge" id="priceBadge"></div>
              </div>
              <div class="big-price" id="stockPrice"></div>
              <div class="desc" id="stockDesc"></div>
              <div class="depth" id="depthGrid"></div>
            </div>
            <div class="panel trade">
              <h3 class="section-title">定價買賣</h3>
              <div id="tradeRows"></div>
            </div>
          </div>

          <div class="section" id="portfolioSection">
            <h3 class="section-title">持股</h3>
            <div id="portfolioList"></div>
          </div>

          <div class="section" id="newsSection">
            <div class="panel foresight">
              <h3 class="section-title">市場行情預知</h3>
              <div id="foresightPanel"></div>
            </div>
            <h3 class="section-title">新聞時事</h3>
            <div id="newsList"></div>
          </div>
        </section>
      </div>
    </main>

    <section class="settlement-screen is-hidden" id="settlementScreen">
      <div class="settlement-panel">
        <div class="start-logo">DAY 30 REPORT</div>
        <h1 class="settlement-title">結算完成</h1>
        <div class="settlement-grid">
          <div class="settlement-metric">
            <span>最高資產</span>
            <strong id="highestEquityText">$0</strong>
          </div>
          <div class="settlement-metric">
            <span>結束資產</span>
            <strong id="finalEquityText">$0</strong>
          </div>
        </div>
        <p class="settlement-copy" id="settlementCopy">你完成了 30 天的市場挑戰。</p>
        <button class="start-button" id="backToStartBtn">回到開始頁</button>
      </div>
    </section>

    <script>
      const sectors = {
        food: "民生",
        energy: "能源",
        tech: "科技",
        logistics: "物流",
        luxury: "奢侈"
      };

      const initialStocks = [
        {
          id: "grain-port",
          name: "穀港商會",
          code: "GPC",
          sector: "food",
          basePrice: 42,
          price: 42,
          supply: 92,
          demand: 104,
          stability: 0.82,
          volatility: 0.045,
          description: "掌握城市糧食與日用品批發，是通膨壓力的第一警報。"
        },
        {
          id: "ember-grid",
          name: "燼網能源",
          code: "EMG",
          sector: "energy",
          basePrice: 64,
          price: 64,
          supply: 88,
          demand: 96,
          stability: 0.66,
          volatility: 0.07,
          description: "燃料與電力供應商，對供需和通膨變化特別敏感。"
        },
        {
          id: "north-lens",
          name: "北境視算",
          code: "NLS",
          sector: "tech",
          basePrice: 78,
          price: 78,
          supply: 72,
          demand: 112,
          stability: 0.55,
          volatility: 0.09,
          description: "預測模型與情報終端供應商，和代幣預知能力有強連動。"
        },
        {
          id: "riverline",
          name: "河線運輸",
          code: "RVL",
          sector: "logistics",
          basePrice: 36,
          price: 36,
          supply: 108,
          demand: 88,
          stability: 0.74,
          volatility: 0.055,
          description: "貨運、倉儲、港口路線。市場熱度高時成交量會跟著放大。"
        },
        {
          id: "moon-silk",
          name: "月絲精品",
          code: "MSK",
          sector: "luxury",
          basePrice: 55,
          price: 55,
          supply: 64,
          demand: 78,
          stability: 0.44,
          volatility: 0.11,
          description: "高級服飾與收藏品，適合做高風險高報酬標的。"
        }
      ];

      const marketSignalDeck = [
        {
          title: "民生採購升溫",
          description: "城市補貨需求增加，民生與物流類股短線受惠。",
          sectorImpacts: { food: 0.07, logistics: 0.04 },
          inflationImpact: 0.006,
          heatImpact: 0.04,
          duration: 3
        },
        {
          title: "市場技術升級",
          description: "撮合速度提高，科技股與高波動標的成交熱度增加。",
          sectorImpacts: { tech: 0.1, luxury: 0.03 },
          inflationImpact: -0.002,
          heatImpact: 0.06,
          duration: 2
        },
        {
          title: "港區運費調整",
          description: "物流成本短暫上升，部分商品價格被推高。",
          sectorImpacts: { logistics: -0.08, food: 0.04, luxury: 0.05 },
          inflationImpact: 0.01,
          heatImpact: 0.02,
          duration: 3
        },
        {
          title: "市場監理加強",
          description: "投機熱度被壓制，穩定型股票受青睞。",
          sectorImpacts: { luxury: -0.08, tech: -0.04, food: 0.03 },
          inflationImpact: -0.008,
          heatImpact: -0.1,
          duration: 2
        },
        {
          title: "節慶採購潮",
          description: "民生與精品需求上升，短線資金快速進場。",
          sectorImpacts: { food: 0.06, luxury: 0.11, logistics: 0.04 },
          inflationImpact: 0.006,
          heatImpact: 0.08,
          duration: 2
        }
      ];

      const lots = [1, 5, 10];
      const storageKey = "stocky-market-demo-html";
      let selectedId = "grain-port";
      let activeTab = "market";
      let state = loadState();

      function createInitialState() {
        return {
          economy: {
            day: 1,
            cash: 1200,
            inflation: 0.021,
            marketHeat: 0.46,
            stabilityFund: 240,
            token: 2,
            foresightUsedToday: false
          },
          stocks: initialStocks.map((stock) => ({ ...stock })),
          holdings: [],
          activeSignals: [],
          upcomingSignal: createSignal(2, 0),
          highestEquity: 1200,
          endResult: null,
          news: ["市場模組啟動：第一階段測試開始，採單機展示。"]
        };
      }

      function loadState() {
        try {
          const saved = localStorage.getItem(storageKey);
          return normalizeState(saved ? JSON.parse(saved) : createInitialState());
        } catch {
          return normalizeState(createInitialState());
        }
      }

      function normalizeState(nextState) {
        if (typeof nextState.highestEquity !== "number") nextState.highestEquity = 1200;
        if (!("endResult" in nextState)) nextState.endResult = null;
        return nextState;
      }

      function saveState() {
        localStorage.setItem(storageKey, JSON.stringify(state));
      }

      function buyStock(stockId, shares) {
        const stock = state.stocks.find((item) => item.id === stockId);
        const cost = roundMoney(stock.price * shares * 1.006);
        if (state.economy.cash < cost) return setMessage("現金不足，無法買入。");

        const existing = state.holdings.find((item) => item.stockId === stockId);
        if (existing) {
          const totalShares = existing.shares + shares;
          existing.averageCost = roundMoney((existing.averageCost * existing.shares + stock.price * shares) / totalShares);
          existing.shares = totalShares;
        } else {
          state.holdings.push({ stockId, shares, averageCost: stock.price });
        }

        state.economy.cash = roundMoney(state.economy.cash - cost);
        stock.demand = clamp(stock.demand + shares * 1.7, 35, 180);
        stock.supply = clamp(stock.supply - shares * 0.9, 30, 180);
        stock.price = roundMoney(stock.price * (1 + shares * 0.004));
        state.news.unshift(`買入 ${stock.name} ${shares} 股，成交價 ${stock.price.toFixed(2)}。`);
        state.news = state.news.slice(0, 12);
        setMessage(`買入成功，花費 ${cost.toFixed(2)}。`);
        render();
      }

      function sellStock(stockId, shares) {
        const stock = state.stocks.find((item) => item.id === stockId);
        const holding = state.holdings.find((item) => item.stockId === stockId);
        if (!holding || holding.shares < shares) return setMessage("持股不足。");

        const proceeds = roundMoney(stock.price * shares * 0.994);
        holding.shares -= shares;
        state.holdings = state.holdings.filter((item) => item.shares > 0);
        state.economy.cash = roundMoney(state.economy.cash + proceeds);
        stock.demand = clamp(stock.demand - shares * 1.1, 35, 180);
        stock.supply = clamp(stock.supply + shares * 1.4, 30, 180);
        stock.price = roundMoney(stock.price * (1 - shares * 0.0035));
        state.news.unshift(`賣出 ${stock.name} ${shares} 股，成交價 ${stock.price.toFixed(2)}。`);
        state.news = state.news.slice(0, 12);
        setMessage(`賣出成功，收入 ${proceeds.toFixed(2)}。`);
        render();
      }

      function useForesight() {
        if (state.economy.token <= 0) return setMessage("代幣不足，無法預知行情。");
        if (state.economy.foresightUsedToday) return setMessage("今天已經使用過預知。");
        state.economy.token -= 1;
        state.economy.foresightUsedToday = true;
        state.upcomingSignal.knownByForesight = true;
        state.news.unshift(`代幣預知：明日可能出現「${state.upcomingSignal.title}」。`);
        state.news = state.news.slice(0, 12);
        setMessage(`你預知了 ${state.upcomingSignal.title}。`);
        render();
      }

      function advanceDay() {
        const day = state.economy.day + 1;
        const maturedSignal = state.upcomingSignal && state.upcomingSignal.day === day ? state.upcomingSignal : null;
        state.activeSignals = state.activeSignals.filter((signal) => signal.day + signal.duration > day);
        if (maturedSignal) state.activeSignals.push({ ...maturedSignal, knownByForesight: false });
        if (maturedSignal || !state.upcomingSignal) state.upcomingSignal = createSignal(day + 1 + (day % 2), day);

        advanceEconomy(day);
        state.stocks = state.stocks.map((stock, index) => advanceStock(stock, day + index));
        state.economy.day = day;
        state.economy.foresightUsedToday = false;
        if (day % 5 === 0) {
          state.economy.token += 1;
          state.news.unshift("個人成長回饋：完成 5 日市場觀察，獲得 1 枚代幣。");
        }
        if (maturedSignal) state.news.unshift(`市場行情：${maturedSignal.title}。${maturedSignal.description}`);
        state.news.unshift(`第 ${day} 日收盤：通膨 ${(state.economy.inflation * 100).toFixed(1)}%，市場熱度 ${(state.economy.marketHeat * 100).toFixed(0)}%。`);
        state.news = state.news.slice(0, 12);
        setMessage(`第 ${day} 日開盤，市場已重新定價。`);
        updateHighestEquity();
        if (day >= 30) {
          finishGame();
          return;
        }
        render();
      }

      function advanceEconomy(day) {
        const eventInflation = state.activeSignals.reduce((sum, signal) => sum + signal.inflationImpact, 0);
        const eventHeat = state.activeSignals.reduce((sum, signal) => sum + signal.heatImpact, 0);
        const overheated = state.economy.marketHeat > 0.72 || state.economy.inflation > 0.065;
        const support = state.economy.stabilityFund > 0 && overheated ? Math.min(18, state.economy.stabilityFund) : 0;
        const stabilizer = support > 0 ? -0.013 : -0.003;
        state.economy.inflation = clamp(state.economy.inflation * 0.88 + 0.009 + eventInflation + stabilizer, -0.02, 0.16);
        state.economy.marketHeat = clamp(state.economy.marketHeat * 0.82 + 0.12 + eventHeat - (support > 0 ? 0.08 : 0), 0.08, 1);
        state.economy.stabilityFund = roundMoney(state.economy.stabilityFund - support + 8 + (day % 3 === 0 ? 3 : 0));
      }

      function advanceStock(stock, seed) {
        const signalImpact = state.activeSignals.reduce((sum, signal) => sum + (signal.sectorImpacts[stock.sector] || 0), 0);
        const demandPressure = (stock.demand - stock.supply) / 220;
        const inflationLift = state.economy.inflation * (stock.sector === "food" || stock.sector === "energy" ? 0.62 : 0.28);
        const heatLift = (state.economy.marketHeat - 0.45) * stock.volatility;
        const deterministicNoise = Math.sin(seed * 12.9898 + stock.basePrice) * stock.volatility * 0.42;
        const stabilizer = ((stock.basePrice - stock.price) / stock.basePrice) * stock.stability * 0.08;
        const change = clamp(demandPressure + signalImpact + inflationLift + heatLift + deterministicNoise + stabilizer, -0.24, 0.28);
        return {
          ...stock,
          price: roundMoney(clamp(stock.price * (1 + change), stock.basePrice * 0.35, stock.basePrice * 3.2)),
          demand: clamp(stock.demand * 0.88 + 75 + state.economy.marketHeat * 26 + signalImpact * 80, 35, 180),
          supply: clamp(stock.supply * 0.9 + 84 - signalImpact * 42 - state.economy.inflation * 60, 30, 180)
        };
      }

      function render() {
        const selected = state.stocks.find((stock) => stock.id === selectedId) || state.stocks[0];
        updateHighestEquity();
        saveState();
        renderSummary();
        renderTabs();
        renderMarket(selected);
        renderPortfolio();
        renderNews();
      }

      function renderSummary() {
        document.getElementById("dayText").textContent = state.economy.day;
        document.getElementById("cashText").textContent = `$${state.economy.cash.toFixed(0)}`;
        document.getElementById("equityText").textContent = `$${totalEquity().toFixed(0)}`;
        setGauge("inflation", state.economy.inflation, `${(state.economy.inflation * 100).toFixed(1)}%`, 0.08);
        setGauge("heat", state.economy.marketHeat, `${(state.economy.marketHeat * 100).toFixed(0)}%`, 0.75);
        setGauge("fund", state.economy.stabilityFund / 320, `$${state.economy.stabilityFund.toFixed(0)}`, 0.15, true);
        document.getElementById("foresightBtn").textContent = `代幣預知 ${state.economy.token}`;
      }

      function renderTabs() {
        document.querySelectorAll(".tab").forEach((tab) => {
          tab.classList.toggle("active", tab.dataset.tab === activeTab);
        });
        document.querySelectorAll(".section").forEach((section) => section.classList.remove("active"));
        document.getElementById(`${activeTab}Section`).classList.add("active");
      }

      function renderMarket(selected) {
        document.getElementById("stockRail").innerHTML = state.stocks
          .map(
            (stock) => `
              <button class="stock-chip ${stock.id === selected.id ? "active" : ""}" data-stock="${stock.id}">
                <span class="code">${stock.code}</span>
                <b>${stock.name}</b>
              </button>
            `
          )
          .join("");

        const delta = ((selected.price - selected.basePrice) / selected.basePrice) * 100;
        const direction = delta >= 0 ? "up" : "down";
        document.getElementById("stockName").textContent = selected.name;
        document.getElementById("stockMeta").textContent = `${selected.code} · ${sectors[selected.sector]}`;
        document.getElementById("stockPrice").textContent = `$${selected.price.toFixed(2)}`;
        document.getElementById("stockDesc").textContent = selected.description;
        document.getElementById("priceBadge").className = `price-badge ${direction}`;
        document.getElementById("priceBadge").textContent = `${delta >= 0 ? "▲" : "▼"} ${delta.toFixed(1)}%`;
        document.getElementById("depthGrid").innerHTML = [
          ["需求", selected.demand, "#1b5b55"],
          ["供給", selected.supply, "#9f6a1b"],
          ["穩定度", selected.stability * 100, "#47618c"],
          ["波動率", selected.volatility * 1000, "#8a4a64"]
        ]
          .map(
            ([label, value, color]) => `
              <div class="depth-item">
                <span>${label}</span>
                <div class="track"><div class="fill" style="width:${Math.min(100, value)}%;background:${color}"></div></div>
              </div>
            `
          )
          .join("");
        document.getElementById("tradeRows").innerHTML = lots
          .map(
            (lot) => `
              <div class="trade-row">
                <b>${lot} 股</b>
                <button class="buy" data-buy="${lot}">買</button>
                <button class="sell" data-sell="${lot}">賣</button>
              </div>
            `
          )
          .join("");
      }

      function renderPortfolio() {
        const target = document.getElementById("portfolioList");
        if (state.holdings.length === 0) {
          target.innerHTML = '<div class="panel empty">尚未持有股票</div>';
          return;
        }
        target.innerHTML = state.holdings
          .map((holding) => {
            const stock = state.stocks.find((item) => item.id === holding.stockId);
            const value = holding.shares * stock.price;
            const pnl = ((stock.price - holding.averageCost) / holding.averageCost) * 100;
            return `
              <button class="holding" data-stock="${stock.id}">
                <span><b>${stock.name}</b><small>${holding.shares} 股 · 均價 $${holding.averageCost.toFixed(2)}</small></span>
                <span class="right"><b>$${value.toFixed(0)}</b><small style="color:${pnl >= 0 ? "var(--green)" : "var(--red)"}">${pnl.toFixed(1)}%</small></span>
              </button>
            `;
          })
          .join("");
      }

      function renderNews() {
        const foresight = document.getElementById("foresightPanel");
        if (state.upcomingSignal && state.upcomingSignal.knownByForesight) {
          foresight.innerHTML = `
            <div class="foresight-card">
              <b>${state.upcomingSignal.title}</b>
              <p>${state.upcomingSignal.description}</p>
            </div>
          `;
        } else {
          foresight.innerHTML = '<div class="desc">尚未預知下一個行情。使用代幣可提前看到一次市場訊號。</div>';
        }
        document.getElementById("newsList").innerHTML = state.news
          .map((item) => `<div class="news-row"><span class="dot"></span><span>${item}</span></div>`)
          .join("");
      }

      function setGauge(id, value, text, dangerAt, inverseDanger = false) {
        const fill = document.getElementById(`${id}Fill`);
        document.getElementById(`${id}Text`).textContent = text;
        fill.style.width = `${clamp(value, 0, 1) * 100}%`;
        fill.classList.toggle("danger", inverseDanger ? value <= dangerAt : value >= dangerAt);
      }

      function setMessage(text) {
        document.getElementById("messageText").textContent = text;
      }

      function totalEquity() {
        return roundMoney(
          state.economy.cash +
            state.holdings.reduce((sum, holding) => {
              const stock = state.stocks.find((item) => item.id === holding.stockId);
              return sum + (stock ? stock.price * holding.shares : 0);
            }, 0)
        );
      }

      function updateHighestEquity() {
        state.highestEquity = Math.max(state.highestEquity || 0, totalEquity());
      }

      function formatMoney(value) {
        return `$${roundMoney(value).toFixed(0)}`;
      }

      function finishGame() {
        updateHighestEquity();
        state.endResult = {
          highestEquity: state.highestEquity,
          finalEquity: totalEquity()
        };
        saveState();
        showSettlement();
      }

      function showSettlement() {
        const result = state.endResult || {
          highestEquity: state.highestEquity,
          finalEquity: totalEquity()
        };
        document.getElementById("highestEquityText").textContent = formatMoney(result.highestEquity);
        document.getElementById("finalEquityText").textContent = formatMoney(result.finalEquity);
        document.getElementById("settlementCopy").textContent =
          `你完成了 30 天挑戰，最高資產比起始資金多 ${formatMoney(result.highestEquity - 1200)}。`;
        document.getElementById("gameApp").classList.add("is-hidden");
        document.getElementById("startScreen").classList.add("is-hidden");
        document.getElementById("settlementScreen").classList.remove("is-hidden");
      }

      function resetToStartPage() {
        state = createInitialState();
        selectedId = "grain-port";
        activeTab = "market";
        localStorage.removeItem(storageKey);
        render();
        document.getElementById("settlementScreen").classList.add("is-hidden");
        document.getElementById("gameApp").classList.add("is-hidden");
        document.getElementById("startScreen").classList.remove("is-hidden");
      }

      function createSignal(day, seed) {
        const template = marketSignalDeck[Math.abs(seed + day * 3) % marketSignalDeck.length];
        return { ...template, id: `${day}-${template.title}`, day };
      }

      function clamp(value, min, max) {
        return Math.min(max, Math.max(min, value));
      }

      function roundMoney(value) {
        return Math.round(value * 100) / 100;
      }

      document.addEventListener("click", (event) => {
        const stockButton = event.target.closest("[data-stock]");
        const buyButton = event.target.closest("[data-buy]");
        const sellButton = event.target.closest("[data-sell]");
        const tabButton = event.target.closest("[data-tab]");

        if (stockButton) {
          selectedId = stockButton.dataset.stock;
          activeTab = "market";
          render();
        }
        if (buyButton) buyStock(selectedId, Number(buyButton.dataset.buy));
        if (sellButton) sellStock(selectedId, Number(sellButton.dataset.sell));
        if (tabButton) {
          activeTab = tabButton.dataset.tab;
          render();
        }
      });

      document.getElementById("nextDayBtn").addEventListener("click", advanceDay);
      document.getElementById("foresightBtn").addEventListener("click", useForesight);
      document.getElementById("startGameBtn").addEventListener("click", () => {
        document.getElementById("startScreen").classList.add("is-hidden");
        if (state.endResult) {
          showSettlement();
        } else {
          document.getElementById("gameApp").classList.remove("is-hidden");
        }
      });
      document.getElementById("backToStartBtn").addEventListener("click", resetToStartPage);
      document.getElementById("resetBtn").addEventListener("click", () => {
        state = createInitialState();
        selectedId = "grain-port";
        activeTab = "market";
        localStorage.removeItem(storageKey);
        setMessage("市場已重置。");
        render();
      });

      setMessage("展示版已載入，可以開始買賣。");
      render();
    </script>
  </body>
</html>
